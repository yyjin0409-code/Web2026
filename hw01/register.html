<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양예진 - 사용자 등록 페이지</title>
</head>
<body>

<header>
    <h1>사용자 등록 신청서</h1>
</header>

<main>
    <section>
        <article>

            <form>
                <fieldset>
                    <legend>기본 정보 (Essential)</legend>

                    <label for="userid">아이디:</label><br>
                    <input type="text" id="userid" name="userid" placeholder="4~12자 영문/숫자" required><br><br>

                    <label for="password">비밀번호:</label><br>
                    <input type="password" id="password" name="password" required><br><br>

                    <label for="email">이메일:</label><br>
                    <input type="email" id="email" name="email" required><br><br>
                </fieldset>

                <br>

                <fieldset>
                    <legend>부가 정보 (Optional)</legend>

                    <label for="phone">연락처:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="010-1234-5678"
                           pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"><br><br>

                    <p>관심 분야:</p>
                    <input type="checkbox" id="html" name="interest" value="HTML5">
                    <label for="html">HTML5</label>

                    <input type="checkbox" id="css" name="interest" value="CSS3">
                    <label for="css">CSS3</label>

                    <input type="checkbox" id="js" name="interest" value="JavaScript">
                    <label for="js">JavaScript</label>

                    <br><br>

                    <label for="level">숙련도:</label><br>
                    <input type="range" id="level" name="level" min="1" max="10" step="1">
                </fieldset>

                <br>

                <input type="submit" value="가입 신청">
                <input type="reset" value="초기화">

            </form>

        </article>
    </section>
</main>

<footer>
    <a href="index.html">홈으로</a>
    <p>© 2026 Web Programming Course. All rights reserved.</p>
</footer>

</body>
</html>
